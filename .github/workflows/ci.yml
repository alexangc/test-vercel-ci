name: Loader pipeline
on:
  push:
  workflow_dispatch:

env:
  API_BASE_URL: https://test-vercel-ci-beta.vercel.app

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Hello world"

      - run:
          response=$(curl -s ${{ env.API_BASE_URL }}/api/echo) &&
          echo $response