name: Loader pipeline
on:
  push:
  workflow_dispatch:

env:
  API_BASE_URL: http://localhost:3000
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        shell: bash
        run: |
          npm ci --prefer-offline --no-audit --no-progress

      - name: Install Vercel
        run: npm install -g vercel

      - name: Start the vercel dev server
        run: |
          npx vercel dev --token ${{ env.VERCEL_TOKEN }} --yes &
          # Store the PID to use later if needed
          echo "VERCEL_PID=$!" >> $GITHUB_ENV

      - name: Wait for the dev server to be ready
        run: |
          # Wait for server to be ready on port 3000
          timeout=10
          counter=0
          echo "Waiting for server to be ready on port 3000..."
          until $(curl --output /dev/null --silent --fail ${{ env.API_BASE_URL }}); do
            if [ $counter -eq $timeout ]; then
              echo "Timed out waiting for server to start"
              exit 1
            fi
            counter=$((counter+1))
            echo "Still waiting for server to be ready... ($counter/$timeout)"
            sleep 1
          done
          echo "Server is ready!"

      - name: Call the app's endpoint
        run:
          response=$(curl -s ${{ env.API_BASE_URL }}/api/echo) &&
          echo $response